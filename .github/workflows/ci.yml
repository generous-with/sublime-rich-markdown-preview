name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch verified dependencies
        run: python tools/fetch_dependencies.py
      - name: Build native host
        run: ./tools/build-host.ps1
      - name: Test plugin lifecycle
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install browser test tools
        run: |
          npm install --ignore-scripts
          npx playwright install chromium
      - name: Test renderer in Chromium
        run: npm test
      - name: Package
        run: ./tools/package.ps1
      - name: Test installer
        run: ./tests/installer.test.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RichMarkdownPreview-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
