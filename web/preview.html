<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src file: data: https: http:; font-src 'self' data:; connect-src 'none'; base-uri file:; form-action 'none'; object-src 'none'">
<link rel="stylesheet" href="vendor/highlight.css">
<style>
:root{color-scheme:dark;font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif;color:#e2e7ed;background:#282e36;font-size:15px}
*{box-sizing:border-box}body{margin:0;padding:24px 30px 50px;line-height:1.7;overflow-wrap:break-word;user-select:text}
main{max-width:1000px;margin:auto}h1,h2,h3,h4{line-height:1.35;font-weight:650;margin:1.3em 0 .6em}h1{font-size:2em;border-bottom:1px solid #505864;padding-bottom:.3em}h2{font-size:1.5em;border-bottom:1px solid #454d58;padding-bottom:.25em}
